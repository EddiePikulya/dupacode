name: Upstream digest

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC (09:00 Kyiv in summer)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/supabitapp/supacode
          git fetch --tags upstream main

      - name: Build and post digest
        run: bash .github/scripts/upstream-digest.sh
